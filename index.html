<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Quiz App</h1>

        <!-- Quiz Section -->
        <div id="quiz-box">

            <div class="quiz-header">
                <span id="question-number">Question 1 of 5</span>
                <span id="score-display">Score: 0</span>
            </div>

            <h2 id="question">Question will appear here</h2>

            <div id="options-container">

                <button class="option">Option 1</button>
                <button class="option">Option 2</button>
                <button class="option">Option 3</button>
                <button class="option">Option 4</button>

            </div>

            <button id="next-btn">Next</button>

        </div>

        <!-- Result Section -->
        <div id="result-box">

            <h2>Quiz Completed!</h2>

            <p id="final-score">Your Score: 0 / 5</p>

            <button id="restart-btn">Restart Quiz</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
